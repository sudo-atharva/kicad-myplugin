[package]
name = "project-manager"
version = "1.4.0"
edition = "2021"
description = "Starts the MyPlugin Project Manager with KiCad's own Python"

[[bin]]
name = "project-manager"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
